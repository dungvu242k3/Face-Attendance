<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập quản trị</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center px-4">
  <form method="post" class="bg-white rounded-xl shadow-xl p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Đăng nhập quản trị</h1>
    {% if error %}
      <div class="mb-4 rounded-lg bg-red-50 text-red-700 px-4 py-3">{{ error }}</div>
    {% endif %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url or '' }}">
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-2">Tên đăng nhập</label>
      <input name="username" required autofocus class="w-full px-4 py-2 border border-gray-300 rounded-lg">
    </div>
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
      <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
    </div>
    <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg">
      Đăng nhập
    </button>
  </form>
</body>
</html>
